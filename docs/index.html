<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой первый сайт</title>
    <style>
        /* Стили для всей страницы */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); /* Красивый градиентный фон */
        }

        /* Стили для белой карточки в центре */
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        /* Стили для заголовка */
        h1 {
            margin-top: 0;
            color: #4a4a4a;
            font-size: 28px;
        }

        /* Стили для текста */
        p {
            line-height: 1.6;
            color: #666;
            font-size: 16px;
            margin-bottom: 25px;
        }

        /* Стили для кнопки */
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background-color: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            transition: all 0.3s ease; /* Плавная анимация */
        }

        /* Эффект при наведении курсора на кнопку */
        .btn:hover {
            background-color: #764ba2;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(118, 75, 162, 0.4);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Привет, Мир! 👋</h1>
        <p>Добро пожаловать на мой самый первый веб-сайт. Я только начинаю свой путь в программировании, и это выглядит потрясающе!</p>
        <a href="#" class="btn">Нажать сюда</a>
    </div>

</body>
</html>
